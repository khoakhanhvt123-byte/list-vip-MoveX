<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etsy Listing Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 36px 20px 80px; position: relative; z-index: 1; }

  header { margin-bottom: 36px; }
  header h1 { font-family: 'Syne', sans-serif; font-size: clamp(26px,5vw,40px); font-weight: 800; letter-spacing: -1px; line-height: 1; }
  header h1 span { color: var(--accent); }
  header p { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 1.5px; text-transform: uppercase; }

  .config-bar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 24px;
  }
  @media(max-width:600px){ .config-bar { grid-template-columns:1fr; } }
  label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
  input[type="password"], select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 9px 12px; border-radius: 8px; outline: none; transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface); }

  .queue-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .queue-header h2 { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .btn-add-row {
    display: flex; align-items: center; gap: 6px;
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all .2s;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .btn-add-row:hover { border-color: var(--accent); color: var(--accent); }

  .product-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 10px;
    display: grid; grid-template-columns: 90px 1fr auto;
    gap: 14px; align-items: center;
    transition: border-color .2s;
    animation: slideIn .25s ease;
  }
  .product-row.focused { border-color: rgba(232,255,71,0.3); }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

  .paste-zone {
    width: 90px; height: 90px; border-radius: 8px;
    border: 2px dashed var(--border); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; transition: all .2s; position: relative; overflow: hidden;
    flex-shrink: 0; user-select: none;
  }
  .paste-zone.active-paste { border-color: var(--accent); background: rgba(232,255,71,0.06); }
  .paste-zone.has-img { border-style: solid; border-color: rgba(74,222,128,0.4); padding:0; }
  .paste-zone img { width:100%; height:100%; object-fit:cover; border-radius:6px; display:block; }
  .paste-hint { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.5; pointer-events:none; }
  .paste-icon { font-size: 22px; pointer-events:none; }
  .remove-img {
    position: absolute; top:2px; right:2px;
    background: rgba(0,0,0,.8); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity .2s; z-index:2;
  }
  .paste-zone:hover .remove-img { opacity:1; }

  .row-inputs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .row-url-wrap { position: relative; }
  .row-url-wrap input[type="text"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px;
    padding: 9px 12px 9px 32px; border-radius: 8px; outline: none; transition: border-color .2s;
  }
  .row-url-wrap input:focus { border-color: var(--accent); }
  .url-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }
  .row-meta { display: flex; align-items: center; justify-content: space-between; }
  .row-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .row-status { font-size: 10px; padding: 2px 7px; border-radius: 4px; }
  .row-status.ready { color: var(--success); background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.2); }
  .row-status.missing { color: var(--muted); }

  .btn-del-row {
    background: none; border: none; color: var(--border);
    font-size: 18px; cursor: pointer; transition: color .2s;
    padding: 4px; align-self: flex-start; flex-shrink: 0;
  }
  .btn-del-row:hover { color: var(--accent2); }

  .run-btn {
    width: 100%; padding: 16px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 10px;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 16px;
  }
  .run-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
  .run-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .progress-wrap { margin-top: 20px; display: none; }
  .progress-wrap.show { display: block; }
  .prog-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; width: 0%; }
  .prog-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .prog-log { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .results-wrap { margin-top: 36px; }
  .results-wrap h2 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 16px; }
  .results-wrap h2 span { color: var(--accent); }
  .divider { height:1px; background:var(--border); margin:28px 0; }

  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
    display: grid; grid-template-columns: 100px 1fr;
    gap: 20px; animation: fadeUp .35s ease forwards; opacity: 0;
    transform: translateY(10px);
  }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  @media(max-width:600px) { .result-card { grid-template-columns:1fr; } }

  .card-img { width:100px; height:100px; border-radius:8px; object-fit:cover; border:1px solid var(--border); }
  .card-img-ph { width:100px; height:100px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:28px; }

  .field { margin-bottom: 12px; }
  .field-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .char-ok { color: var(--success); }
  .char-warn { color: var(--accent2); }
  .field-val { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--text); }
  .tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip { background: rgba(232,255,71,0.07); border: 1px solid rgba(232,255,71,0.15); color: var(--accent); font-size: 11px; padding: 3px 9px; border-radius: 4px; }
  .action-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; transition: all .2s; text-transform: uppercase; letter-spacing: 1px;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,107,53,.07); border: 1px solid rgba(255,107,53,.2); color: var(--accent2);
    font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; transition: all .2s; text-transform: uppercase; letter-spacing: 1px;
  }
  .dl-btn:hover { background: rgba(255,107,53,.15); }

  .status-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
  .status-chip.processing { background: rgba(232,255,71,.08); color: var(--accent); border: 1px solid rgba(232,255,71,.15); }
  .status-chip.done { background: rgba(74,222,128,.08); color: var(--success); border: 1px solid rgba(74,222,128,.2); }
  .status-chip.error { background: rgba(255,107,53,.08); color: var(--accent2); border: 1px solid rgba(255,107,53,.2); }
  .spinner { width:10px; height:10px; border:2px solid rgba(232,255,71,.3); border-top-color:var(--accent); border-radius:50%; animation: spin .7s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-msg { background: rgba(255,107,53,.06); border: 1px solid rgba(255,107,53,.2); color: var(--accent2); padding: 8px 12px; border-radius: 8px; font-size: 12px; }

  .img-links { display: flex; flex-direction: column; gap: 4px; max-height:120px; overflow-y:auto; margin-bottom:6px; }
  .img-link-row { display:flex; align-items:center; gap:8px; font-size:11px; }
  .img-link-row a { color:var(--muted); text-decoration:none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .2s; }
  .img-link-row a:hover { color:var(--text); }
  .img-link-row button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; transition:color .2s; padding:0; }
  .img-link-row button:hover { color:var(--accent); }

  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-size: 12px; padding: 10px 20px; border-radius: 8px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .blacklist-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .blacklist-bar-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .blacklist-bar-header h3 {
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
  .blacklist-status {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .blacklist-status.loaded { color: var(--success); background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.2); }
  .blacklist-status.loading { color: var(--accent); background: rgba(232,255,71,.08); border: 1px solid rgba(232,255,71,.15); }
  .blacklist-status.error { color: var(--accent2); background: rgba(255,107,53,.08); border: 1px solid rgba(255,107,53,.2); }
  .blacklist-status.idle { color: var(--muted); background: transparent; border: 1px solid var(--border); }
  .blacklist-input-row { display: flex; gap: 8px; align-items: center; }
  .blacklist-input-row input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px;
    padding: 9px 12px; border-radius: 8px; outline: none; transition: border-color .2s;
  }
  .blacklist-input-row input:focus { border-color: var(--accent); }
  .btn-fetch-bl {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 11px; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; transition: all .2s;
    text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0;
  }
  .btn-fetch-bl:hover { border-color: var(--accent); color: var(--accent); }
  .blacklist-info { font-size: 10px; color: var(--muted); }
  .blacklist-info span { color: var(--accent); }

  .status-chip.blocked { background: rgba(255,107,53,.08); color: var(--accent2); border: 1px solid rgba(255,107,53,.2); }
  .tm-badge {
    display: inline-block; background: rgba(255,107,53,.12); border: 1px solid rgba(255,107,53,.25);
    color: var(--accent2); font-size: 10px; padding: 2px 8px; border-radius: 4px;
    margin-top: 6px; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>ETSY<span>LIST</span></h1>
    <p>Personalized POD · Paste &amp; Queue · Batch Generate</p>
  </header>



  <div class="blacklist-bar">
    <div class="blacklist-bar-header">
      <h3>🛡 Blacklist</h3>
      <span class="blacklist-status idle" id="blStatus">Loading...</span>
    </div>
    <div class="blacklist-info" id="blInfo">Đang tải danh sách blacklist...</div>
  </div>

  <div class="queue-header">
    <h2>⚡ Product Queue</h2>
    <button class="btn-add-row" onclick="addRow()">+ Add row</button>
  </div>
  <div id="queueList"></div>

  <button class="run-btn" id="runBtn" onclick="runAll()" disabled>
    ⚡ Generate All Listings
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="prog-info">
      <span id="progLabel">Processing...</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-log" id="progLog"></div>
  </div>

  <div class="results-wrap" id="resultsWrap" style="display:none;">
    <div class="divider"></div>
    <h2>Results <span id="resultCount"></span></h2>
    <div id="resultCards"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────
const BLACKLIST_URL = '';   // <- dán link CSV Google Sheet vào đây

let rows = [];
let rowId = 0;

// ─── BLACKLIST ────────────────────────────────────────────
let blacklistNiches = [];

async function fetchBlacklist() {
  const url = BLACKLIST_URL;
  if (!url) {
    setBlStatus('idle', 'No URL');
    document.getElementById('blInfo').textContent = 'Chưa cấu hình BLACKLIST_URL.';
    return;
  }
  setBlStatus('loading', 'Loading...');
  document.getElementById('blInfo').textContent = 'Đang fetch...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    // Normalize line endings, tự detect TSV hay CSV
    const sep = raw.includes('\t') ? '\t' : ',';
    const lines = raw.replace(/\r/g, '').split('\n').slice(1);
    const niches = [];
    for (const line of lines) {
      if (!line.trim()) continue;
      const cols = line.split(sep);
      // Quét tất cả cột, lấy cột nào có text không phải số
      let val = '';
      for (const col of cols) {
        const c = col.replace(/^"|"$/g, '').trim();
        if (c && !/^\d+$/.test(c) && !/^https?:\/\//i.test(c)) {
          val = c; break;
        }
      }
      if (val) niches.push(val.toLowerCase());
    }
    blacklistNiches = [...new Set(niches)];
    setBlStatus('loaded', '✓ ' + blacklistNiches.length + ' niches');
    document.getElementById('blInfo').innerHTML = 'Đã load <span>' + blacklistNiches.length + ' niche</span>. Mọi sản phẩm sẽ được check trước khi gen listing.';
  } catch(e) {
    setBlStatus('error', 'Error');
    document.getElementById('blInfo').textContent = '⚠ Không fetch được: ' + e.message;
  }
}

function setBlStatus(type, text) {
  const el = document.getElementById('blStatus');
  el.className = 'blacklist-status ' + type;
  el.textContent = text;
}

async function checkTMWithGemini(imgB64, imgMime, productInfo) {
  if (blacklistNiches.length === 0) return { matched: false };
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'tm-check', imgB64, imgMime, productInfo, blacklistNiches })
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || 'TM check failed');
  }
  return res.json();
}

// ─── INIT ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  fetchBlacklist();
  addRow();
  addRow();
  addRow();
});

// ─── ADD / REMOVE ROW ────────────────────────────────────
function addRow() {
  const id = ++rowId;
  rows.push({ id, imageDataUrl: null, imageBlob: null, url: '' });
  renderQueue();
  checkReady();
}

function removeRow(id) {
  if (rows.length <= 1) return;
  rows = rows.filter(r => r.id !== id);
  renderQueue();
  checkReady();
}

// ─── RENDER QUEUE ────────────────────────────────────────
function renderQueue() {
  const list = document.getElementById('queueList');
  list.innerHTML = '';
  rows.forEach(r => {
    const hasImg = !!r.imageDataUrl;
    const hasUrl = !!r.url.trim();
    const ready = hasImg || hasUrl;
    const div = document.createElement('div');
    div.className = 'product-row';
    div.id = `row-${r.id}`;
    div.innerHTML = `
      <div class="paste-zone ${hasImg ? 'has-img' : ''}" id="pz-${r.id}"
           onclick="activatePasteZone(${r.id})"
           title="Click để focus, rồi Ctrl+V paste ảnh">
        ${hasImg
          ? `<img src="${r.imageDataUrl}" alt="">
             <button class="remove-img" onclick="removeImg(event,${r.id})">✕</button>`
          : `<div class="paste-icon">📋</div>
             <div class="paste-hint">Click →<br>Ctrl+V<br>paste ảnh</div>`
        }
      </div>
      <div class="row-inputs">
        <div class="row-meta">
          <span class="row-label">Shopify URL <span style="opacity:.5">(optional)</span></span>
          <span class="row-status ${ready ? 'ready' : 'missing'}">${ready ? '✓ ready' : 'empty'}</span>
        </div>
        <div class="row-url-wrap">
          <span class="url-icon">🔗</span>
          <input type="text"
            value="${escHtml(r.url)}"
            placeholder="https://macustom.com/products/..."
            oninput="onUrlInput(${r.id}, this.value)"
          />
        </div>
      </div>
      <button class="btn-del-row" onclick="removeRow(${r.id})" title="Remove row">✕</button>
    `;
    list.appendChild(div);
  });
}

// ─── PASTE ZONE ACTIVATION ───────────────────────────────
let activePasteRowId = null;

function activatePasteZone(id) {
  // Deactivate previous
  if (activePasteRowId !== null) {
    const prev = document.getElementById(`pz-${activePasteRowId}`);
    if (prev) prev.classList.remove('active-paste');
    // If clicking same zone, toggle off
    if (activePasteRowId === id) { activePasteRowId = null; return; }
  }
  activePasteRowId = id;
  const zone = document.getElementById(`pz-${id}`);
  if (zone) zone.classList.add('active-paste');
  showToast('✓ Ô đã chọn — Ctrl+V để paste ảnh');
}

// ─── PASTE HANDLER ────────────────────────────────────────
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (!item.type.startsWith('image/')) continue;
    e.preventDefault();
    const blob = item.getAsFile();
    if (!blob) continue;

    // Determine target row
    let targetId = activePasteRowId;
    if (targetId === null) {
      // Find first empty row
      const empty = rows.find(r => !r.imageDataUrl);
      if (!empty) { showToast('⚠ Tất cả ô đã có ảnh. Thêm row mới.'); return; }
      targetId = empty.id;
    }

    const reader = new FileReader();
    reader.onload = ev => {
      const r = rows.find(x => x.id === targetId);
      if (!r) return;
      r.imageDataUrl = ev.target.result;
      r.imageBlob = blob;
      // Deactivate paste zone after paste
      activePasteRowId = null;
      renderQueue();
      checkReady();
      showToast(`✓ Ảnh đã paste vào sản phẩm #${rows.findIndex(x=>x.id===targetId)+1}`);
    };
    reader.readAsDataURL(blob);
    return;
  }
});

// ─── URL INPUT ───────────────────────────────────────────
function onUrlInput(id, val) {
  const r = rows.find(x => x.id === id);
  if (r) r.url = val;
  checkReady();
  // Update status label only
  const statusEl = document.querySelector(`#row-${id} .row-status`);
  if (statusEl) {
    const ready = !!val.trim() || !!r?.imageDataUrl;
    statusEl.className = `row-status ${ready ? 'ready' : 'missing'}`;
    statusEl.textContent = ready ? '✓ ready' : 'empty';
  }
}

function removeImg(e, id) {
  e.stopPropagation();
  const r = rows.find(x => x.id === id);
  if (r) { r.imageDataUrl = null; r.imageBlob = null; }
  renderQueue();
  checkReady();
}

// ─── READY CHECK ─────────────────────────────────────────
function checkReady() {
  const hasAny = rows.some(r => r.imageDataUrl || r.url.trim());
  document.getElementById('runBtn').disabled = !hasAny;
}

// ─── SHOPIFY SCRAPER ─────────────────────────────────────
async function scrapeShopify(url) {
  const match = url.match(/\/products\/([^/?#]+)/);
  if (!match) throw new Error('Invalid Shopify URL');
  const base = url.match(/^https?:\/\/[^/]+/)[0];
  const res = await fetch(`${base}/products/${match[1]}.json`);
  if (!res.ok) throw new Error(`Shopify API HTTP ${res.status}`);
  const d = await res.json();
  const p = d.product;
  return {
    productTitle: p.title || '',
    description: (p.body_html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,400),
    imageLinks: (p.images||[]).map(i => i.src),
    firstImageUrl: p.images?.[0]?.src || null
  };
}

async function remoteToBase64(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((ok,err) => {
    const r = new FileReader();
    r.onload = () => ok({ data: r.result.split(',')[1], mime: blob.type });
    r.onerror = err;
    r.readAsDataURL(blob);
  });
}

// ─── GEMINI ───────────────────────────────────────────────
async function callGemini(imgB64, imgMime, productInfo) {
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'gen-listing', imgB64, imgMime, productInfo })
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || 'Gen listing failed');
  }
  return res.json();
}

// ─── MAIN RUN ────────────────────────────────────────────
async function runAll() {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  const validRows = rows.filter(r => r.imageDataUrl || r.url.trim());
  const total = validRows.length;

  document.getElementById('resultCards').innerHTML = '';
  document.getElementById('resultsWrap').style.display = 'none';
  document.getElementById('progressWrap').classList.add('show');
  setProgress(0, total, 'Starting...');

  for (let i = 0; i < validRows.length; i++) {
    const row = validRows[i];
    setProgress(i, total, `Processing ${i+1}/${total}...`);
    const cardId = addPendingCard(i);

    try {
      let imgB64 = null, imgMime = 'image/jpeg';
      let productInfo = null, imageLinks = [], thumbUrl = null;

      if (row.url.trim()) {
        try {
          setProgress(i, total, `Scraping Shopify ${i+1}/${total}...`);
          productInfo = await scrapeShopify(row.url.trim());
          imageLinks = productInfo.imageLinks;
          thumbUrl = productInfo.firstImageUrl;
        } catch(e) { console.warn('Shopify:', e.message); }
      }

      if (row.imageDataUrl) {
        imgB64 = row.imageDataUrl.split(',')[1];
        imgMime = row.imageDataUrl.match(/data:([^;]+)/)?.[1] || 'image/jpeg';
        if (!thumbUrl) thumbUrl = row.imageDataUrl;
      } else if (productInfo?.firstImageUrl) {
        try {
          const r = await remoteToBase64(productInfo.firstImageUrl);
          imgB64 = r.data; imgMime = r.mime;
        } catch(_) {}
      }

      // ── Bước 1: TM check (chỉ khi blacklist đã load)
      if (blacklistNiches.length > 0) {
        setProgress(i, total, `TM check ${i+1}/${total}...`);
        const tmResult = await checkTMWithGemini(imgB64, imgMime, productInfo);
        if (tmResult.matched) {
          updateCardBlocked(cardId, tmResult.detectedNiche, tmResult.matchedEntry, thumbUrl);
          setProgress(i+1, total, `Blocked ${i+1}/${total}`);
          continue;
        }
      }

      // ── Bước 2: Gen listing
      setProgress(i, total, `Gemini analyzing ${i+1}/${total}...`);
      const result = await callGemini(imgB64, imgMime, productInfo);

      updateCard(cardId, {
        title: result.title, tags: result.tags,
        imageLinks, thumbUrl,
        isLocalOnly: !!row.imageDataUrl && !row.url.trim()
      });
    } catch(e) {
      updateCardError(cardId, e.message);
    }
    setProgress(i+1, total, `Done ${i+1}/${total}`);
  }

  document.getElementById('resultsWrap').style.display = 'block';
  document.getElementById('resultCount').textContent = `(${validRows.length})`;
  btn.disabled = false;
  checkReady();
}

function setProgress(done, total, log) {
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';
  document.getElementById('progLabel').textContent = `${done}/${total}`;
  if (log) document.getElementById('progLog').textContent = log;
}

// ─── RESULT CARDS ────────────────────────────────────────
let cardCtr = 0;
function addPendingCard(index) {
  const id = 'rc-'+(++cardCtr);
  const wrap = document.getElementById('resultCards');
  const div = document.createElement('div');
  div.id = id; div.className = 'result-card';
  div.innerHTML = `
    <div class="card-img-ph">⏳</div>
    <div>
      <div class="status-chip processing"><span class="spinner"></span> Analyzing ${index+1}...</div>
    </div>`;
  wrap.appendChild(div);
  document.getElementById('resultsWrap').style.display = 'block';
  return id;
}

function updateCard(id, { title, tags, imageLinks, thumbUrl, isLocalOnly }) {
  const card = document.getElementById(id);
  if (!card) return;
  const tLen = (title||'').length;
  const tCount = (tags||[]).length;
  const tagsStr = (tags||[]).join(', ');

  const imgEl = thumbUrl
    ? `<img class="card-img" src="${escHtml(thumbUrl)}" alt="product">`
    : `<div class="card-img-ph">🖼️</div>`;

  let imagesSection = '';
  if (!isLocalOnly && imageLinks?.length) {
    imagesSection = `
      <div class="field">
        <div class="field-lbl">Product Images <span class="char-ok">${imageLinks.length} files</span></div>
        <div class="img-links">
          ${imageLinks.map((lnk,i)=>`
            <div class="img-link-row">
              <a href="${escHtml(lnk)}" target="_blank">img_${i+1}.jpg</a>
              <button onclick="dlOne('${escHtml(lnk)}',${i+1})" title="Download">⬇</button>
            </div>`).join('')}
        </div>
        <div class="action-row">
          <button class="dl-btn" id="dlall-${id}">⬇ Download all</button>
          <button class="copy-btn" id="cplinks-${id}">📋 Copy links</button>
        </div>
      </div>`;
  }

  card.innerHTML = `
    ${imgEl}
    <div>
      <div class="status-chip done">✓ Done</div>
      <div class="field">
        <div class="field-lbl">Etsy Title <span class="${tLen<=140?'char-ok':'char-warn'}">${tLen}/140</span></div>
        <div class="field-val">${escHtml(title)}</div>
        <div class="action-row">
          <button class="copy-btn" id="cptitle-${id}">📋 Copy title</button>
        </div>
      </div>
      <div class="field">
        <div class="field-lbl">Tags <span class="${tCount===13?'char-ok':'char-warn'}">${tCount}/13</span></div>
        <div class="field-val tags-wrap">
          ${(tags||[]).map(t=>`<span class="tag-chip">${escHtml(t)}</span>`).join('')}
        </div>
        <div class="action-row">
          <button class="copy-btn" id="cptags-${id}">📋 Copy tags</button>
        </div>
      </div>
      ${imagesSection}
    </div>`;

  // Attach events safely (no inline JSON escaping issues)
  const btnTitle = document.getElementById(`cptitle-${id}`);
  if (btnTitle) btnTitle.addEventListener('click', () => cp(btnTitle, title));

  const btnTags = document.getElementById(`cptags-${id}`);
  if (btnTags) btnTags.addEventListener('click', () => cp(btnTags, tagsStr));

  const btnDlAll = document.getElementById(`dlall-${id}`);
  if (btnDlAll) btnDlAll.addEventListener('click', () => dlAll(imageLinks));

  const btnCpLinks = document.getElementById(`cplinks-${id}`);
  if (btnCpLinks) btnCpLinks.addEventListener('click', () => cp(btnCpLinks, imageLinks.join('\n')));
}

function updateCardBlocked(id, detectedNiche, matchedEntry, thumbUrl) {
  const card = document.getElementById(id);
  if (!card) return;
  const imgEl = thumbUrl
    ? `<img class="card-img" src="${escHtml(thumbUrl)}" alt="product">`
    : `<div class="card-img-ph">🚫</div>`;
  card.innerHTML = `
    ${imgEl}
    <div>
      <div class="status-chip blocked">🚫 TM Blocked</div>
      <div class="err-msg">
        Phát hiện niche có trademark: <strong>${escHtml(detectedNiche)}</strong>
        <div class="tm-badge">Blacklist match: ${escHtml(matchedEntry)}</div>
      </div>
    </div>`;
}

function updateCardError(id, msg) {
  const card = document.getElementById(id);
  if (!card) return;
  card.innerHTML = `
    <div class="card-img-ph">❌</div>
    <div>
      <div class="status-chip error">✕ Error</div>
      <div class="err-msg">⚠ ${escHtml(msg)}</div>
    </div>`;
}

// ─── UTILS ───────────────────────────────────────────────
function cp(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  });
}

async function dlOne(url, index) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `product_${index}.${blob.type.split('/')[1]||'jpg'}`;
    a.click();
  } catch { window.open(url,'_blank'); }
}

async function dlAll(links) {
  for (let i=0;i<links.length;i++) {
    await dlOne(links[i],i+1);
    if (i<links.length-1) await new Promise(r=>setTimeout(r,300));
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

</script>
